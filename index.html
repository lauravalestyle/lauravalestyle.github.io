gtag('js',new Date());

</script>

<script>
var _paq=window._paq=window._paq||[];
_paq.push(['setCampaignNameKey','utm_campaign']);
_paq.push(['setCampaignKeywordKey','utm_term']);
_paq.push(['trackPageView']);
_paq.push(['enableLinkTracking']);
_paq.push(['enableHeartBeatTimer',15]);
(function(){

  _paq.push(['setTrackerUrl',u+'matomo.php']);
  _paq.push(['setSiteId','1']);
  var d=document,g=d.createElement('script'),s=d.getElementsByTagName('script')[0];
  g.async=true;
  g.src='https://cdn.matomo.cloud/lauravalestyle.matomo.cloud/matomo.js';

<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;font-family:Arial,Helvetica,sans-serif}
body{background:#17110f;color:#fff}
a{text-decoration:none;color:inherit}
.landing{
  position:relative;
  width:100%;
  min-height:100svh;
  min-height:100dvh;
  overflow:hidden;
  isolation:isolate;
}
.background{
  position:absolute;
  inset:0;
  z-index:-3;
  background-image:url("assets/laura-background.jpg");
  background-size:cover;
  background-position:center center;
  background-repeat:no-repeat;
  transform:scale(1.01);
}
.shade{
  position:absolute;
  inset:0;
  z-index:-2;
  background:
    linear-gradient(
      180deg,
      rgba(0,0,0,.05) 0%,
      rgba(0,0,0,.03) 38%,
      rgba(20,10,7,.18) 55%,
      rgba(35,18,13,.68) 73%,
      rgba(38,20,15,.94) 88%,
      rgba(30,15,11,.98) 100%
    );
}
.content{
  position:relative;
  z-index:2;
  width:100%;
  max-width:680px;
  min-height:100svh;
  min-height:100dvh;
  margin:0 auto;
  padding:
    max(42px,env(safe-area-inset-top))
    20px
    max(24px,env(safe-area-inset-bottom));
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-end;
  text-align:center;
}
.name{
  margin:0 0 20px;
  font-size:clamp(2.25rem,9vw,4rem);
  line-height:1;
  font-weight:500;
  letter-spacing:-.035em;
  text-shadow:0 2px 14px rgba(0,0,0,.45);
}
.socials{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:22px;
  margin:0 0 24px;
}
.social{
  width:44px;
  height:44px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:50%;
  background:rgba(0,0,0,.10);
}
.social img{
  display:block;
  width:30px !important;
  height:30px !important;
  max-width:30px !important;
  max-height:30px !important;
  object-fit:contain;
}
.tease{
  width:100%;
  max-width:520px;
  margin:0 0 22px;
  color:#fff;
  font-size:clamp(1rem,4vw,1.2rem);
  line-height:1.5;
  font-weight:500;
  text-shadow:0 2px 12px rgba(0,0,0,.55);
}
.fanvue-button{
  width:100%;
  max-width:620px;
  min-height:76px;
  display:flex;
  align-items:center;
  text-align:left;
  padding:12px 16px;
  border-radius:8px;
  background:#fff;
  color:#3d302b;
  box-shadow:0 12px 35px rgba(0,0,0,.30);
}
.fanvue-mark{
  width:48px;
  height:48px;
  flex:0 0 48px;
  margin-right:14px;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#e3a48e;
  color:#fff;
  font-size:22px;
  font-weight:800;
}
.fanvue-copy{
  display:flex;
  flex-direction:column;
  gap:3px;
  min-width:0;
}
.fanvue-copy strong{
  font-size:18px;
  line-height:1.1;
  font-weight:700;
}
.fanvue-copy small{
  font-size:13px;
  line-height:1.25;
  color:#786862;
}
.arrow{
  margin-left:auto;
  padding-left:12px;
  font-size:30px;
  line-height:1;
  color:#8c776e;
}
.age{
  margin:12px 0 0;
  font-size:12px;
  color:rgba(255,255,255,.82);
  text-shadow:0 1px 8px rgba(0,0,0,.45);
}
@media(max-width:600px){
  .content{
    padding-left:16px;
    padding-right:16px;
    padding-top:35px;
  }
  .name{margin-bottom:18px}
  .socials{gap:16px;margin-bottom:20px}
  .social{width:42px;height:42px}
  .social img{
    width:28px !important;
    height:28px !important;
    max-width:28px !important;
    max-height:28px !important;
  }
  .tease{
    font-size:17px;
    line-height:1.45;
    margin-bottom:20px;
  }
  .fanvue-button{min-height:72px}
}
</style>
</head>

<body>
<main class="landing">
  <div class="background" aria-hidden="true"></div>
  <div class="shade" aria-hidden="true"></div>

  <section class="content" aria-label="Laura Vale links">
    <div class="name">Laura Vale</div>

    <nav class="socials" aria-label="Laura Vale social media">
      <a class="social" data-track="instagram_click" data-destination="instagram" data-placement="social_icons"
         href="https://www.instagram.com/lauravale.style" target="_blank" rel="noopener noreferrer" aria-label="Instagram">
        <img src="https://cdn.simpleicons.org/instagram/ffffff" alt="Instagram" width="30" height="30">
      </a>

      <a class="social" data-track="tiktok_click" data-destination="tiktok" data-placement="social_icons"
         href="https://www.tiktok.com/@lauravale.style?_r=1&_t=ZS-9AURgjc0ZS0" target="_blank" rel="noopener noreferrer" aria-label="TikTok">
        <img src="https://cdn.simpleicons.org/tiktok/ffffff" alt="TikTok" width="30" height="30">
      </a>

      <a class="social" data-track="facebook_click" data-destination="facebook" data-placement="social_icons"
         href="https://www.facebook.com/share/1Bx5uaZtCD/" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
        <img src="https://cdn.simpleicons.org/facebook/ffffff" alt="Facebook" width="30" height="30">
      </a>

      <a class="social" data-track="threads_click" data-destination="threads" data-placement="social_icons"
         href="https://www.threads.com/@lauravale.style" target="_blank" rel="noopener noreferrer" aria-label="Threads">
        <img src="https://cdn.simpleicons.org/threads/ffffff" alt="Threads" width="30" height="30">
      </a>
    </nav>

    <p class="tease">
      You found the little corner I don't share everywhere.<br>
      Come a little closer… you might like what you find. 😉
    </p>

    <a class="fanvue-button"
       data-track="fanvue_click"
       data-ga4-event="fanvue_click"
       data-destination="fanvue"
       data-placement="fanvue_button"
       href="https://www.fanvue.com/lauravale"
       target="_blank"
       rel="noopener noreferrer"
       aria-label="Open Laura Vale on Fanvue">
      <span class="fanvue-mark" aria-hidden="true">F</span>
      <span class="fanvue-copy">
        <strong>Fanvue</strong>
        <small>Exclusive content &amp; private chat</small>
      </span>
      <span class="arrow" aria-hidden="true">›</span>
    </a>

    <p class="age">18+ • Private content is on Fanvue</p>
  </section>
</main>

<script>
(function(){
  function cleanText(e){
    return e.textContent.trim().replace(/\s+/g,' ').substring(0,150);
  }

  document.querySelectorAll('[data-track]').forEach(function(el){
    el.addEventListener('click',function(){
      var t=el.dataset.track||'unknown';
      var destination=el.dataset.destination||'unknown';
      var placement=el.dataset.placement||'unknown';
      var label=cleanText(el)||destination;

      if(typeof gtag==='function'){
        gtag('event','cta_click',{
          cta_name:t,
          cta_destination:destination,
          cta_location:placement,
          button_name:label,
          button_text:label,
          link_url:el.href||'',
          page_location:window.location.href,
          page_title:document.title
        });

        if(destination==='fanvue'){
          gtag('event','fanvue_click',{
            cta_name:t,
            placement:placement,
            destination:'fanvue',
            link_url:el.href||'',
            page_location:window.location.href,
            page_title:document.title,
            transport_type:'beacon'
          });
        }
      }

      if(window._paq){
        _paq.push(['trackEvent',
          destination==='fanvue'?'Monetization':'Social',
          'Click',
          t
        ]);
      }
    });
  });

  if(typeof gtag==='function'){
    var u=new URLSearchParams(window.location.search);
    gtag('event','landing_page_view',{
      page_location:window.location.href,
      page_title:document.title,
      referrer:document.referrer||'(direct)',
      utm_source:u.get('utm_source')||'(not set)',
      utm_medium:u.get('utm_medium')||'(not set)',
      utm_campaign:u.get('utm_campaign')||'(not set)',
      utm_content:u.get('utm_content')||'(not set)',
      utm_term:u.get('utm_term')||'(not set)'
    });
  }
})();
</script>
</body>
</html>
